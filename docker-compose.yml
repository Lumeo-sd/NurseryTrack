version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nurserytrack-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-nurserytrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nurserytrack_secure_password}
      POSTGRES_DB: ${DB_NAME:-nurserytrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nurserytrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nurserytrack-network

  # MinIO S3-compatible Storage
  minio:
    image: minio/minio:latest
    container_name: nurserytrack-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - nurserytrack-network

  # Redis Cache (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: nurserytrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nurserytrack-network

  # Node.js Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nurserytrack-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3005}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nurserytrack}
      DB_USER: ${DB_USER:-nurserytrack}
      DB_PASSWORD: ${DB_PASSWORD:-nurserytrack_secure_password}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_this}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-nursery-photos}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${API_PORT:-3005}:3005"
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped
    networks:
      - nurserytrack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin for Database Management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nurserytrack-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nurserytrack.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - nurserytrack-network

  # Nginx Reverse Proxy (optional but recommended for production)
  nginx:
    image: nginx:alpine
    container_name: nurserytrack-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - minio
    networks:
      - nurserytrack-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  pgadmin_data:

networks:
  nurserytrack-network:
    driver: bridge
